<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Acoustic Connect — GraphQL Query Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ── CSS Variables & Brand ────────────────────────────────── */
:root{
  --bg:#ffffff;--bg2:#f8f8fb;--bg3:#efefef;--bg4:#e8e8f0;
  --line:#d0d1d8;--line2:#c2c3cc;
  --dim:#b0b2c0;--mid:#8b8da0;--muted:#5a5d77;--soft:#3d4060;--text:#2a2c50;--bright:#1f1e5d;
  --peri:#706cff;--peri2:#5754e0;--periglow:rgba(112,108,255,.18);--perilight:rgba(112,108,255,.08);
  --green:#00df8f;--greenglow:rgba(0,223,143,.2);--greenlight:rgba(0,223,143,.1);
  --lime:#c8ff49;--limelight:rgba(200,255,73,.15);
  --violet:#1f1e5d;
  --red:#e84040;--amber:#e8960a;
  --mono:'JetBrains Mono',monospace;--ui:'Bricolage Grotesque',-apple-system,sans-serif;
}
/* ── Reset ───────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--ui)}
/* ── Layout ──────────────────────────────────────────────── */
.wrap{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh}
.body{display:flex;flex:1;overflow:hidden}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column}
/* ── Header ──────────────────────────────────────────────── */
header{border-bottom:1px solid var(--line);padding:0 20px;height:52px;display:flex;align-items:center;gap:12px;background:var(--violet);flex-shrink:0;box-shadow:0 1px 0 rgba(112,108,255,.3)}
.hmark{width:30px;height:30px;border-radius:8px;background:var(--peri);display:flex;align-items:center;justify-content:center;font-family:var(--ui);font-size:11px;font-weight:700;color:#fff;box-shadow:0 2px 8px var(--periglow);letter-spacing:-.5px}
.hname{font-family:var(--ui);font-size:14px;font-weight:600;color:#ffffff;letter-spacing:-.2px}
.hsep{width:1px;height:18px;background:rgba(255,255,255,.25)}
.htag{font-size:11px;color:rgba(255,255,255,.55);letter-spacing:.2px;font-family:var(--ui)}
.warn-pill{font-size:9px;background:rgba(200,255,73,.18);border:1px solid rgba(200,255,73,.5);color:var(--lime);padding:3px 8px;border-radius:20px;margin-left:6px;font-family:var(--ui);font-weight:500}
/* ── API Bar ─────────────────────────────────────────────── */
.apibar{display:flex;align-items:center;gap:10px;padding:8px 20px;border-bottom:1px solid var(--line);background:var(--bg2);flex-shrink:0;flex-wrap:wrap}
.apibar label{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap;font-family:var(--ui);font-weight:500}
.apibar input{background:var(--bg);border:1.5px solid var(--line);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:11px;padding:6px 10px;outline:none;width:320px;transition:border-color .15s}
.apibar input:focus{border-color:var(--peri);box-shadow:0 0 0 3px var(--perilight)}
.apibar select{background:var(--bg);border:1.5px solid var(--line);border-radius:8px;color:var(--text);font-family:var(--ui);font-size:12px;padding:6px 10px;outline:none;cursor:pointer;transition:border-color .15s}
.apibar select:focus{border-color:var(--peri)}
.ep-pill{font-size:10px;color:var(--peri2);padding:4px 10px;background:var(--perilight);border:1.5px solid rgba(112,108,255,.2);border-radius:20px;display:flex;align-items:center;gap:6px;font-family:var(--ui);font-weight:500}
.ep-dot{width:6px;height:6px;border-radius:50%;background:var(--peri);box-shadow:0 0 6px var(--periglow);flex-shrink:0}
/* ── Sidebar ─────────────────────────────────────────────── */
.sidebar{width:248px;border-right:1px solid var(--line);overflow-y:auto;flex-shrink:0;background:var(--bg2)}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.sb-hdr{padding:12px 14px 6px;font-size:9px;color:var(--mid);letter-spacing:2.5px;text-transform:uppercase;border-bottom:1px solid var(--line);font-family:var(--ui);font-weight:600}
.sb-cat{padding:14px 14px 4px;font-size:9px;color:var(--mid);letter-spacing:2px;text-transform:uppercase;font-family:var(--ui);font-weight:600}
.sb-btn{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;font-family:var(--ui);font-size:12px;font-weight:400;color:var(--muted);border-left:3px solid transparent;transition:all .12s;border-radius:0}
.sb-btn:hover{background:var(--bg3);color:var(--text)}
.sb-btn.active{background:var(--perilight);color:var(--peri2);border-left-color:var(--peri);font-weight:500}
.sb-btn.active.mut{background:var(--greenlight);color:#008f5a;border-left-color:var(--green)}
.tag{font-size:8px;font-weight:700;padding:2px 7px;border-radius:20px;flex-shrink:0;letter-spacing:.8px;font-family:var(--ui)}
.tag.q{background:var(--perilight);color:var(--peri2);border:1px solid rgba(112,108,255,.25)}
.tag.m{background:var(--greenlight);color:#007a4d;border:1px solid rgba(0,223,143,.3)}
/* ── Empty State ─────────────────────────────────────────── */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:40px}
.empty-glyph{font-size:44px;color:var(--peri);opacity:.3}
.empty-t{font-family:var(--ui);font-size:17px;font-weight:700;color:var(--violet)}
.empty-s{font-size:12px;color:var(--muted);text-align:center;line-height:1.7;max-width:340px;font-family:var(--ui)}
/* ── Operation Area ──────────────────────────────────────── */
.op-area{flex:1;overflow:hidden;display:flex;flex-direction:column}
.op-top{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--bg);flex-shrink:0}
.op-top-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.op-name{font-family:var(--ui);font-size:15px;font-weight:700;color:var(--violet)}
.op-desc{font-size:12px;color:var(--muted);font-family:var(--ui);line-height:1.5}
.op-fix{font-size:11px;color:#007a4d;background:var(--greenlight);border:1px solid rgba(0,223,143,.35);padding:4px 10px;border-radius:6px;margin-top:6px;display:inline-block;font-family:var(--ui)}
.split{flex:1;overflow:hidden;display:flex}
/* ── Form Pane ───────────────────────────────────────────── */
.form-pane{width:312px;border-right:1px solid var(--line);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;flex-shrink:0;background:var(--bg2)}
.form-pane::-webkit-scrollbar{width:3px}
.form-pane::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.section{flex-shrink:0;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(31,30,93,.07)}
.sec-hdr{cursor:pointer;list-style:none;user-select:none}
.sec-hdr::-webkit-details-marker{display:none}
.sec-hdr::after{display:inline-block;content:'▾';margin-left:auto;font-size:11px;transition:transform .15s}
.section:not([open]) .sec-hdr::after{transform:rotate(-90deg)}
.section:not([open]) .sec-hdr{border-bottom:none}
.list-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.list-row input{flex:1 1 90px;min-width:0}
.list-row select{flex:0 0 92px;min-width:0;padding:7px 4px}
.list-row select:first-child:only-of-type{flex:1 1 92px}
.rm-btn{flex-shrink:0;width:26px;height:30px;border:1.5px solid var(--line);background:transparent;border-radius:8px;color:var(--muted);cursor:pointer}
.rm-btn:hover{border-color:var(--red);color:var(--red)}
.add-btn{padding:6px 10px;border:1.5px dashed var(--peri);background:transparent;border-radius:8px;color:var(--peri);cursor:pointer;font-family:var(--ui);font-size:12px;font-weight:600}
.add-btn:hover{background:var(--perilight)}
.sec-hdr{padding:9px 13px;border-bottom:1px solid var(--line);font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:6px;font-family:var(--ui);font-weight:600;background:var(--bg2)}
.sec-body{padding:13px;display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:4px;font-family:var(--ui);font-weight:600}
.req-star{color:var(--red)}
.opt-tag{font-size:9px;color:var(--mid);border:1px solid var(--line);padding:1px 5px;border-radius:4px;text-transform:none;letter-spacing:0;font-weight:400;font-family:var(--ui)}
.field-hint{font-size:10px;color:var(--mid);margin-top:2px;line-height:1.4;font-family:var(--ui)}
.field-warn{font-size:10px;color:var(--amber);margin-top:2px;line-height:1.4;font-family:var(--ui)}
input,select,textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:11.5px;padding:7px 10px;outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--peri);box-shadow:0 0 0 3px var(--perilight)}
input::placeholder,textarea::placeholder{color:var(--dim)}
select option{background:var(--bg)}
.checkbox-row{display:flex;align-items:center;gap:8px;cursor:pointer}
.checkbox-row input[type=checkbox]{width:auto;accent-color:var(--peri);cursor:pointer}
.checkbox-row span{font-size:12px;color:var(--soft);font-family:var(--ui)}
.no-params{color:var(--mid);font-size:12px;line-height:1.8;padding:4px 0;font-family:var(--ui)}
/* ── Output Pane ─────────────────────────────────────────── */
.output-pane{flex:1;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.out-hdr{padding:10px 18px;border-bottom:1px solid var(--line);background:var(--bg2);display:flex;align-items:center;gap:9px;flex-shrink:0}
.out-label{font-size:9px;color:var(--muted);letter-spacing:2.5px;text-transform:uppercase;font-family:var(--ui);font-weight:600}
.out-actions{margin-left:auto;display:flex;gap:7px}
.copy-btn{display:flex;align-items:center;gap:5px;padding:7px 14px;background:var(--peri);color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:var(--ui);font-size:12px;font-weight:600;transition:all .15s}
.copy-btn:hover{background:var(--peri2);box-shadow:0 4px 12px var(--periglow)}
.copy-btn.done{background:var(--green);color:var(--violet)}
.alt-btn{padding:7px 12px;background:transparent;border:1.5px solid var(--line);color:var(--muted);border-radius:8px;cursor:pointer;font-family:var(--ui);font-size:12px;transition:all .15s}
.alt-btn:hover{border-color:var(--peri);color:var(--peri)}
/* ── Query Display & Syntax ──────────────────────────────── */
.query-wrap{flex:1;overflow:auto;padding:16px;background:var(--bg)}
.query-wrap::-webkit-scrollbar{width:5px}
.query-wrap::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.query-display{font-size:12.5px;line-height:1.9;white-space:pre;counter-reset:line}
.ql{display:block;padding-left:42px;position:relative}
.ql::before{content:counter(line);counter-increment:line;position:absolute;left:0;width:32px;text-align:right;color:var(--dim);font-size:10px;padding-right:8px;border-right:1px solid var(--line);user-select:none}
.kw{color:var(--violet);font-weight:600}
.arg{color:var(--peri2)}
.str{color:#007a4d}
.num{color:#c06000}
.br{color:var(--muted)}
/* ── Utilities & Animation ───────────────────────────────── */
.curl-divider{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;border-top:1px solid var(--line);padding:10px 16px 0;margin-top:12px}
.curl-actions{padding:8px 16px 12px}
.toast{position:fixed;bottom:18px;right:18px;z-index:100;background:var(--violet);border:1px solid var(--peri);color:#fff;border-radius:10px;padding:10px 16px;font-size:12px;font-family:var(--ui);font-weight:500;box-shadow:0 8px 24px rgba(31,30,93,.25);display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.fadein{animation:fadeIn .17s ease}
/* ── Run Button & Response Panel ─────────────────────────── */
.run-btn{padding:7px 16px;background:var(--green);border:none;border-radius:8px;color:#0a2a1a;font-family:var(--ui);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;letter-spacing:.3px}
.run-btn:hover{background:#00c47e;box-shadow:0 0 0 3px var(--greenglow)}
.run-btn:disabled{opacity:.5;cursor:not-allowed}
.run-btn.loading{background:var(--bg3);color:var(--muted)}
.response-section{border-top:1px solid var(--line);margin-top:0}
.response-hdr{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg2)}
.response-label{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;font-family:var(--ui);font-weight:500}
.status-pill{font-size:10px;font-family:var(--mono);padding:2px 8px;border-radius:4px;font-weight:600}
.status-ok{background:var(--greenlight);color:#007a4d;border:1px solid var(--green)}
.status-err{background:rgba(232,64,64,.1);color:var(--red);border:1px solid var(--red)}
.status-warn{background:rgba(232,150,10,.1);color:var(--amber);border:1px solid var(--amber)}
.response-body{padding:16px;overflow:auto;max-height:340px;font-family:var(--mono);font-size:11.5px;line-height:1.7;white-space:pre;color:var(--text)}
.response-body.empty{color:var(--dim);font-style:italic;font-family:var(--ui);font-size:12px;padding:20px 16px}
.response-body .rk{color:var(--peri2)}
.response-body .rv{color:#007a4d}
.response-body .rn{color:#c06000}
.response-body .rb{color:var(--violet);font-weight:600}
.response-body .re{color:var(--red)}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:10px;height:10px;border:2px solid var(--line);border-top-color:var(--peri);border-radius:50%;animation:spin .7s linear infinite;margin-right:6px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hmark">AC</div>
    <div class="hname">Acoustic Connect</div>
    <div class="hsep"></div>
    <div class="htag">GraphQL Query Builder</div>
    <span class="warn-pill">⚠ Live-tested · filter syntax</span>
    <div style="margin-left:auto;font-size:10px;color:rgba(255,255,255,.45);font-family:'Bricolage Grotesque',sans-serif">Schema R5 · runtime-verified</div>
  </header>

  <div class="apibar">
    <label>API Key</label>
    <input type="password" id="api-key" placeholder="x-api-key value" autocomplete="off"/>
    <label>Region</label>
    <select id="region"></select>
    <div class="ep-pill"><span class="ep-dot"></span><span id="ep-txt"></span></div>
  </div>

  <div class="body">
    <div class="sidebar"><div id="sb"></div></div>
    <div class="content" id="content">
      <div class="empty">
        <div class="empty-glyph">{ }</div>
        <div class="empty-t">Select an operation</div>
        <div class="empty-s">All queries runtime-verified against the live API. The <code style="color:var(--amber)">type</code> argument on dataSets is removed (deprecated + dead in production) — use <code style="color:var(--peri)">filter</code> instead.</div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   1. CONFIG
   ───────────────────────────────────────────────────────────────
   Add or edit API regions here — no other changes needed.
   ═══════════════════════════════════════════════════════════════ */
const REGIONS = [
  { label: 'US East (us-1)', url: 'https://connect-gql-us-1.goacoustic.com' },
  { label: 'EU (eu-1)',       url: 'https://connect-gql-eu-1.goacoustic.com' },
  { label: 'APAC AU (au-1)', url: 'https://connect-gql-au-1.goacoustic.com' },
  { label: 'Canada (ca-1)',  url: 'https://connect-gql-ca-1.goacoustic.com' },
];


/* ═══════════════════════════════════════════════════════════════
   2. UTILITIES
   ═══════════════════════════════════════════════════════════════ */
/** HTML-escape a value for safe injection into attribute strings */
function _esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}


/* ═══════════════════════════════════════════════════════════════
   3. FIELD RENDERER REGISTRY
   ───────────────────────────────────────────────────────────────
   Maps field type → render function(f, val) → HTML string.

   To add a new input type:
     FieldRenderers.mytype = (f, val) => '<html string>'

   Supported types: text | number | password | select | checkbox | textarea | list
   ═══════════════════════════════════════════════════════════════ */
const FieldRenderers = {
  text(f, val) {
    return `<input id="f-${f.id}" type="text" placeholder="${f.ph||''}" value="${_esc(val??'')}"/>`;
  },
  number(f, val) {
    return `<input id="f-${f.id}" type="number" placeholder="${f.ph||''}" value="${_esc(val??'')}"/>`;
  },
  password(f, val) {
    return `<input id="f-${f.id}" type="password" placeholder="${f.ph||''}" value="${_esc(val??'')}"/>`;
  },
  select(f, val) {
    const current = val ?? f.def;
    const opts = (f.opts||[]).map(o =>
      `<option value="${_esc(o)}"${current===o?' selected':''}>${_esc(o)}</option>`
    ).join('');
    return `<select id="f-${f.id}">${opts}</select>`;
  },
  checkbox(f, val) {
    const checked = (val !== undefined ? val : f.def) ? 'checked' : '';
    return `<label class="checkbox-row"><input id="f-${f.id}" type="checkbox" ${checked}/><span>${f.label}</span></label>`;
  },
  /** Native date+time picker; value is local time "YYYY-MM-DDTHH:MM" */
  datetime(f, val) {
    return `<input id="f-${f.id}" type="datetime-local" value="${_esc(val??'')}"/>`;
  },
  textarea(f, val) {
    return `<textarea id="f-${f.id}" rows="${f.rows||3}" placeholder="${f.ph||''}">${_esc(val??'')}</textarea>`;
  },
  /** Repeatable rows. f.cols: [{ k, ph?, opts? }]; value: array of row objects */
  list(f, rows) {
    const cell = (c, r, i) => c.opts
      ? `<select data-list="${f.id}" data-i="${i}" data-k="${c.k}">${c.opts.map(o =>
          `<option${(r[c.k] ?? c.opts[0]) === o ? ' selected' : ''}>${_esc(o)}</option>`).join('')}</select>`
      : `<input type="text" data-list="${f.id}" data-i="${i}" data-k="${c.k}" placeholder="${c.ph||''}" value="${_esc(r[c.k]??'')}"/>`;
    return (rows || []).map((r, i) =>
      `<div class="list-row">${f.cols.map(c => cell(c, r, i)).join('')}` +
      `<button type="button" class="rm-btn" data-rm="${f.id}" data-i="${i}" title="Remove">×</button></div>`
    ).join('') + `<button type="button" class="add-btn" data-add="${f.id}">+ ${f.add || 'Add another'}</button>`;
  },
};


/* ═══════════════════════════════════════════════════════════════
   4. BUILD HELPERS  (namespace: Q)
   ───────────────────────────────────────────────────────────────
   Reusable GraphQL fragment builders for operation build() fns.
   ═══════════════════════════════════════════════════════════════ */
const Q = {
  /** filter: [{ field: "f", eq: "v" }]  — contacts, dataSets, etc. */
  arrayFilter: (field, value) =>
    `filter: [{ field: "${field}", eq: "${value}" }]`,

  /** filter: { field: "f", eq: "v" }  — products (object, not array) */
  objectFilter: (field, value) =>
    `filter: { field: "${field}", eq: "${value}" }`,

  /** Returns a pagination args array; pass to .join('\n    ') */
  pagination: (first, after) => {
    const a = [`first: ${first || 10}`];
    if (after) a.push(`after: "${after}"`);
    return a;
  },

  /**
   * Renders attribute lines: { name: "x", value: "y" }
   * Skips pairs where name or value is empty/undefined.
   * All values are quoted as strings.
   */
  attrLines: (pairs) =>
    pairs
      .filter(p => p && p.name && p.value !== undefined && p.value !== '')
      .map(p => `{ name: "${p.name}", value: "${p.value}" }`)
      .join('\n        '),

  /**
   * Like attrLines but preserves numeric types (no quotes for numbers).
   * Use for product catalog mutations where unitPrice etc. must be numeric.
   */
  attrLinesTyped: (pairs) =>
    pairs
      .filter(p => p && p.name && p.value !== undefined && p.value !== '')
      .map(p => {
        const v = (p.value !== '' && !isNaN(p.value)) ? p.value : `"${p.value}"`;
        return `{ name: "${p.name}", value: ${v} }`;
      })
      .join('\n        '),

  /** datetime-local value → ISO-8601 UTC (e.g. 2026-10-01T18:30:00.000Z).
      Empty → now + fallbackDays (placeholder), or '' if no fallback. */
  iso: (v, fallbackDays, endOfMinute) => {
    if (v) {
      const d = new Date(v);
      if (isNaN(d)) return v;
      if (endOfMinute) d.setSeconds(59, 999);   /* "23:59" end → 23:59:59.999 */
      return d.toISOString();
    }
    return fallbackDays === undefined ? '' : new Date(Date.now() + fallbackDays * 864e5).toISOString();
  },

  /** Rows from a list field with every listed key non-empty */
  rows: (list, ...keys) => (list || []).filter(r => keys.every(k => r[k] !== undefined && r[k] !== '')),

  /** consent: { consentGroups: [...] } block from a consent list field, or '' if empty */
  consent: (list, pad = '      ') => {
    const groups = Q.rows(list, 'id').map(r => {
      const st = r.status || 'OPT_IN', ch = r.chan || 'EMAIL';
      const p = pad + '      ';
      const chLine = ch !== '(none)' ? `\n${p}channels: [{ channel: ${ch}, status: ${st} }]` : '';
      return `${pad}    {\n${p}consentGroupId: "${r.id}"\n${p}status: ${st}${chLine}\n${pad}    }`;
    });
    return groups.length ? `\n${pad}consent: {\n${pad}  consentGroups: [\n${groups.join('\n')}\n${pad}  ]\n${pad}}` : '';
  },
};

/* ═══════════════════════════════════════════════════════════════
   6. STATE
   Central store for the active operation and its field values.
   ═══════════════════════════════════════════════════════════════ */
const State = {
  op:   null,
  vals: {},

  /** Reset and initialise defaults for a new operation */
  init(op) {
    this.op   = op;
    this.vals = {};
    (op.sections || []).forEach(sec =>
      sec.f.forEach(f => { if (f.def !== undefined) this.vals[f.id] = structuredClone(f.def); })
    );
  },

  set(id, value) { this.vals[id] = value; },

  /** Locate a Field definition within the current op by its id */
  findField(id) {
    for (const sec of (this.op?.sections || []))
      for (const f of sec.f)
        if (f.id === id) return f;
    return null;
  },
};


/* ═══════════════════════════════════════════════════════════════
   7. SYNTAX HIGHLIGHTER
   ═══════════════════════════════════════════════════════════════ */
const SyntaxHighlighter = {
  highlight(raw) {
    return raw.split('\n').map(line => {
      let h = _esc(line);
      h = h.replace(/\b(mutation|query)\b/,    '<span class="kw">$1</span>');
      h = h.replace(/&quot;([^&]*)&quot;/g,     '<span class="str">&quot;$1&quot;</span>');
      h = h.replace(/:\s*(\d+)(\s|$)/g,         ': <span class="num">$1</span>$2');
      h = h.replace(/([{}[\]])/g,               '<span class="br">$1</span>');
      h = h.replace(/\b([a-zA-Z_]\w*)(\s*):/g,  '<span class="arg">$1</span>$2:');
      return `<span class="ql">${h}</span>`;
    }).join('');
  },
};

/* ═══════════════════════════════════════════════════════════════
   9. FORM RENDERER
   Renders field sections and wires a single delegated listener
   on the form pane — no per-field re-binding on op switch.
   ═══════════════════════════════════════════════════════════════ */
const FormRenderer = {
  render(pane, op) {
    if (!op.sections.length) {
      pane.innerHTML = '<div class="no-params">No parameters required. This query runs as-is.</div>';
      return;
    }

    op.sections.forEach(sec => {
      const el      = document.createElement('details');
      el.className  = 'section';
      el.open       = true;
      el.innerHTML  =
        `<summary class="sec-hdr"><span>${sec.i}</span>${sec.t}</summary>` +
        `<div class="sec-body">${sec.f.map(f => this._renderField(f)).join('')}</div>`;
      pane.appendChild(el);
    });

    this._bindDelegate(pane);
  },

  _renderField(f) {
    const val      = State.vals[f.id];
    const renderer = FieldRenderers[f.type] || FieldRenderers.text;
    const input    = renderer(f, val);

    /* Checkboxes carry their own <label> — skip the outer wrapper */
    if (f.type === 'checkbox') {
      return `<div class="field">${input}</div>`;
    }

    const badge = f.req
      ? `<span class="req-star">*</span>`
      : `<span class="opt-tag">optional</span>`;
    const hint  = f.hint ? `<div class="field-hint">${f.hint}</div>` : '';
    const warn  = f.warn ? `<div class="field-warn">⚠ ${f.warn}</div>` : '';
    const body  = f.type === 'list' ? `<div class="field" data-listwrap="${f.id}">${input}</div>` : input;

    return `<div class="field"><label>${f.label} ${badge}</label>${body}${hint}${warn}</div>`;
  },

  /** Re-render one list field after a row is added or removed */
  _refreshList(id) {
    const wrap = document.querySelector(`[data-listwrap="${id}"]`);
    if (wrap) wrap.innerHTML = FieldRenderers.list(State.findField(id), State.vals[id]);
    OutputRenderer.update();
  },

  /** Single delegated listener handles all input types */
  _bindDelegate(pane) {
    pane.addEventListener('click', e => {
      const add = e.target.dataset?.add, rm = e.target.dataset?.rm;
      if (add) {
        (State.vals[add] ||= []).push({});
        this._refreshList(add);
        document.querySelector(`[data-listwrap="${add}"] .list-row:last-of-type input`)?.focus();
      } else if (rm) {
        State.vals[rm].splice(+e.target.dataset.i, 1);
        this._refreshList(rm);
      }
    });
    /* List cells: data-list / data-i / data-k → State.vals[list][i][k] */
    const listInput = e => {
      const d = e.target.dataset;
      if (!d?.list) return false;
      State.vals[d.list][+d.i][d.k] = e.target.value;
      OutputRenderer.update();
      return true;
    };
    pane.addEventListener('input', listInput);
    pane.addEventListener('change', e => {
      if (listInput(e)) return;
      const id = e.target.id?.replace(/^f-/, '');
      if (!id) return;
      const field = State.findField(id);
      if (!field) return;
      State.set(id, field.type === 'checkbox' ? e.target.checked : e.target.value);
      OutputRenderer.update();
    });
    pane.addEventListener('input', e => {
      const id = e.target.id?.replace(/^f-/, '');
      if (!id) return;
      const field = State.findField(id);
      if (!field || field.type === 'select' || field.type === 'checkbox') return;
      State.set(id, e.target.value);
      OutputRenderer.update();
    });
  },
};


/* ═══════════════════════════════════════════════════════════════
   10. OUTPUT RENDERER
   Renders the generated GraphQL + curl command into the pane.
   ═══════════════════════════════════════════════════════════════ */
const OutputRenderer = {
  update() {
    if (!State.op) return;
    const raw = State.op.build(State.vals);

    const qWrap = document.getElementById('query-wrap');
    if (qWrap) qWrap.innerHTML =
      `<div class="query-display">${SyntaxHighlighter.highlight(raw)}</div>`;

    const cWrap = document.getElementById('curl-wrap');
    if (cWrap) cWrap.innerHTML =
      `<div class="query-display" style="color:var(--peri2);font-size:11px">${_esc(this._buildCurl(raw))}</div>`;
  },

  _buildCurl(query) {
    const key     = document.getElementById('api-key')?.value || 'YOUR_API_KEY';
    const ep      = document.getElementById('region')?.value  || REGIONS[0].url;
    const escaped = query.replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\n/g,'\\n');
    return `curl -X POST '${ep}' \\\n  -H "x-api-key: ${key}" \\\n  -H "Content-Type: application/json" \\\n  --data '{"query":"${escaped}"}'`;
  },

  rawQuery() { return State.op ? State.op.build(State.vals) : ''; },
  rawCurl()  { return this._buildCurl(this.rawQuery()); },
};


/* ═══════════════════════════════════════════════════════════════
   11. CONTENT RENDERER
   Orchestrates op selection → state init → pane render.
   ═══════════════════════════════════════════════════════════════ */
const ContentRenderer = {
  select(op) {
    State.init(op);
    Sidebar.setActive(op.id);
    this._render(op);
  },

  _render(op) {
    const container = document.getElementById('content');
    container.innerHTML = '';

    const area      = document.createElement('div');
    area.className  = 'op-area fadein';
    const fixHtml   = op.fix
      ? `<div class="op-fix"><span style="color:var(--amber)">⚠ Fix applied:</span> ${_esc(op.fix)}</div>`
      : '';

    area.innerHTML = `
      <div class="op-top">
        <div class="op-top-row">
          <span class="tag ${op.type}">${op.type === 'm' ? 'MUTATION' : 'QUERY'}</span>
          <span class="op-name">${op.label}</span>
        </div>
        <div class="op-desc">${op.desc}</div>
        ${fixHtml}
      </div>
      <div class="split">
        <div class="form-pane" id="form-pane"></div>
        <div class="output-pane">
          <div class="out-hdr">
            <span class="out-label">Generated Query</span>
            <div class="out-actions">
              <button class="copy-btn" id="copy-btn" onclick="Clipboard.copy('query')">⌘ Copy Query</button>
              <button class="run-btn" id="run-btn" onclick="ApiRunner.run()">▶ Run</button>
            </div>
          </div>
          <div class="query-wrap" id="query-wrap"></div>
          <div class="curl-divider">curl</div>
          <div class="query-wrap" id="curl-wrap"></div>
          <div class="curl-actions">
            <button class="copy-btn" id="curl-copy-btn" onclick="Clipboard.copy('curl')">⌘ Copy curl</button>
          </div>
          <div class="response-section" id="response-section">
            <div class="response-hdr">
              <span class="response-label">Response</span>
              <span class="status-pill" id="response-status" style="display:none"></span>
            </div>
            <div class="response-body empty" id="response-body">Run a query to see the response here.</div>
          </div>
        </div>
      </div>`;

    container.appendChild(area);
    FormRenderer.render(document.getElementById('form-pane'), op);
    OutputRenderer.update();
  },
};


/* ═══════════════════════════════════════════════════════════════
   12. API RUNNER
   Executes the current query against the selected endpoint.
   ═══════════════════════════════════════════════════════════════ */
const ApiRunner = {
  async run() {
    const key   = document.getElementById('api-key')?.value?.trim();
    const ep    = document.getElementById('region')?.value;
    const proxy = 'https://connect-api-proxy.vaibhav-kadam.workers.dev';
    const query = OutputRenderer.rawQuery();

    if (!key) { this._setStatus('warn', 'No API key'); this._setBody('⚠ Enter your x-api-key in the bar above.', true); return; }
    if (!query) { this._setStatus('warn', 'No query'); this._setBody('⚠ Select an operation first.', true); return; }

    const btn = document.getElementById('run-btn');
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Running…'; }
    this._setStatus('', '');
    this._setBody('', true);

    /* Route through proxy if set, otherwise call API directly.
       Proxy receives: { endpoint, apiKey, query } and forwards to Connect. */
    const fetchUrl = proxy || ep;
    const fetchBody = proxy
      ? JSON.stringify({ endpoint: ep, apiKey: key, query })
      : JSON.stringify({ query });
    const fetchHeaders = proxy
      ? { 'Content-Type': 'application/json' }
      : { 'Content-Type': 'application/json', 'x-api-key': key };

    try {
      const res = await fetch(fetchUrl, {
        method: 'POST',
        headers: fetchHeaders,
        body: fetchBody,
      });

      let json;
      try { json = await res.json(); } catch { json = { error: 'Non-JSON response from server' }; }

      const hasErrors = json.errors && json.errors.length > 0;
      if (!res.ok || hasErrors) {
        const msg = hasErrors ? json.errors.map(e => e.message).join('; ') : `HTTP ${res.status}`;
        this._setStatus('err', `${res.status} Error`);
        this._setBody(this._colorize(json), false);
      } else {
        this._setStatus('ok', `${res.status} OK`);
        this._setBody(this._colorize(json), false);
      }
    } catch (err) {
      const isCors = err instanceof TypeError && err.message.toLowerCase().includes('failed to fetch');
      this._setStatus('err', isCors ? 'CORS blocked' : 'Network error');
      this._setBody(
        isCors
          ? `⚠ CORS blocked — the Connect API rejected the request from this origin.\n\nAsk the Connect platform team to add this origin to their CORS allowlist:\n  ${location.origin}\n\nAlternatively, use the ⌘ Copy curl button and run the command in your terminal.`
          : `⚠ ${err.message}`,
        true
      );
    } finally {
      if (btn) { btn.disabled = false; btn.innerHTML = '▶ Run'; }
    }
  },

  _setStatus(type, text) {
    const el = document.getElementById('response-status');
    if (!el) return;
    el.textContent = text;
    el.className = 'status-pill' + (type ? ' status-' + type : '');
    el.style.display = text ? '' : 'none';
  },

  _setBody(content, isPlain) {
    const el = document.getElementById('response-body');
    if (!el) return;
    if (isPlain) {
      el.className = 'response-body empty';
      el.textContent = content;
    } else {
      el.className = 'response-body';
      el.innerHTML = content;
    }
  },

  _colorize(obj) {
    return JSON.stringify(obj, null, 2)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+\.?\d*([eE][+-]?\d+)?)/g, match => {
        if (/^"/.test(match)) {
          return /:$/.test(match)
            ? `<span class="rk">${match}</span>`
            : `<span class="rv">${match}</span>`;
        }
        if (/true|false/.test(match)) return `<span class="rb">${match}</span>`;
        if (/null/.test(match)) return `<span class="re">${match}</span>`;
        return `<span class="rn">${match}</span>`;
      });
  },
};


/* ═══════════════════════════════════════════════════════════════
   13. CLIPBOARD
   ═══════════════════════════════════════════════════════════════ */
const Clipboard = {
  copy(target) {
    const text = target === 'curl' ? OutputRenderer.rawCurl() : OutputRenderer.rawQuery();
    const btnId = target === 'curl' ? 'curl-copy-btn' : 'copy-btn';
    const orig  = target === 'curl' ? '⌘ Copy curl'   : '⌘ Copy Query';

    navigator.clipboard.writeText(text).then(
      ()  => this._flash(btnId, orig),
      ()  => { /* fallback for non-HTTPS */
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        this._flash(btnId, orig);
      }
    );
  },

  _flash(btnId, orig) {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    btn.textContent = '✓ Copied!';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('done'); }, 2000);
  },
};


/* ═══════════════════════════════════════════════════════════════
   14. INIT
   ═══════════════════════════════════════════════════════════════ */
(function init() {
  /* Populate region selector from REGIONS config */
  const sel = document.getElementById('region');
  REGIONS.forEach(r => {
    const opt       = document.createElement('option');
    opt.value       = r.url;
    opt.textContent = r.label;
    sel.appendChild(opt);
  });
  document.getElementById('ep-txt').textContent = REGIONS[0].url;

  /* Sync endpoint pill and regenerate curl on config change */
  document.getElementById('api-key').addEventListener('input', () => OutputRenderer.update());
  sel.addEventListener('change', e => {
    document.getElementById('ep-txt').textContent = e.target.value;
    OutputRenderer.update();
  });

  Sidebar.build();
})();
</script>
